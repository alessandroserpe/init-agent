name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run local benchmark guard
        run: python experiments/evaluate.py --strict --min-cases 4

      - name: Run graph quality guard
        run: python experiments/flow-graph/evaluate.py --strict --min-resolution-rate 1.0

      - name: Verify optional native parser isolation
        env:
          INIT_AGENT_REQUIRE_NATIVE_TEST: "1"
        run: |
          python -m pip install -e '.[treesitter]'
          python -m unittest tests.test_native_isolation -v
